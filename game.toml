# game.toml: what xboxrecomp-cli needs to know about Burnout 3. The CLI reads
# it on every command (./burnout3 runs the CLI at [cli] commit); see the
# CLI's docs/manifest.md for every key. Upstream's regen.sh, Setup.cmd and
# MSVC build are untouched and still work on their own.
schema = 1

[game]
name = "Burnout 3: Takedown"
slug = "burnout3"
env_header = "src/env/recomp_env_game.h"
env_doc = "docs/running.md"

[xbe]
path = "Burnout 3 Takedown/default.xbe"
title_id = 0x4541005B
# The known dump (the user's, 2026-10-04). Another dump builds, packages and
# plays with a warning.
sha256 = ["9f497acd82adb8edfb72cc31aeeb35010b45d32b13a3f1fc6540717ff24d13f9"]
# The release this port is made from (`burnout3 fingerprint --toml`),
# restated by the README, and the section hashes that tell a near dump apart.
region = 0x1  # NTSC-U
version = 1
title = "Burnout 3"

[xbe.sections]
".text" = "cd1f84b51b09a254bc5bb366e0a72f326263ec8a75fea8cf9ae00ea367f75c44"
"XMV" = "fbe67d17163c1cffffa8f7791b62a1dc673869da6da051ce112232872da7668d"
"DSOUND" = "cee9886517244cdc0cefcc89a4d5101e9c8a9c4fa434b628c1db3966c0fedead"
"WMADEC" = "322b55dd14264e0ab0eed5abda32619c5b2a3404afbfe3932ba49c000e5f275c"
"XONLINE" = "cdaa04276a156f30f3dbb3e42cd1ba6fa123b7382c9caec7cbbf1fb54723ec2d"
"XNET" = "85f06a9759fdea4217cd801bb588d4d0b26b8a662bff81d7f57785b1662e9286"
"D3D" = "9e54a32b962d678486d54137a03c6b8dc17612a9273cf493ed85f8746ad08106"
"XGRPH" = "80d119dea191ed39102e46e3e196a5b35faafa49a0d033fcd8a996fc8760f0c6"
"XPP" = "276bbd1f979ac502885e4f29aa2df903b9b0c04a51c6543b7d3662c7f0082f03"
".rdata" = "7d0c9c060bcc6234154b0021e3aac8fb650aab89132e48b6b2892cc91126e4d7"
".data" = "78877a4f6d994cd049aa0fb534a7f28750878caa30d8c6811a08768ce3a1ad7a"
"DOLBY" = "f0a884e7a36c81d3f6e5254ea998ced15c326d5212f2dbc341c1afb3817c780d"
"XON_RD" = "4e44d8cfda6e1eaaeac0e531971cb89e1e6f50ec529cb9332d48a414459bc19d"
".data1" = "23b8a197543241d533f775f546f884b143e45a93f4e4fdd43dafb1c69f5fea6f"
"$$XTIMAGE" = "eb28e6a4ac98f9e7779496c68931e47f2332c4b3c97aa329c19da88c61d64b87"
"$$XSIMAGE" = "fdaef682abfb695e39936fe8a0300bd711df770e3773fe47003f5c681626be38"
".XTLID" = "b1c532b58db48815694e55c17b96e42f0dcacd7513a247be843c92a2a61c3344"

# The CLI at a release tag. The commit locks the tag: a tag that names
# another commit (moved, re-pushed) is refused. 0.7.5 and newer build the
# player wizard ([wizard]) and publish a release with its CHANGELOG notes;
# 0.7.7 pins the Proton the game runs on (GE-Proton11-7) in the SteamOS
# launcher; the commit below is the floor, since it reads [public] and
# [layout].
[cli]
tag = "v0.22.0"
commit = "a994f6aec0972346f65063bd2586398aad1e4b21"
url = "https://github.com/apexJCL/xboxrecomp-cli.git"

[toolkit]
# The toolkit fork's public branch, which BLiNX 2 builds on too (the
# one-window guard and folder rows, render.aniso, Partition1\CACHE out
# of the game folder).
url = "https://github.com/apexJCL/xboxrecomp.git"
tag = "blinx2-v0.15.0"
branch = "blinx2/portability"
commit = "92f8954cac77fb95f11955ebd0b28b1267a31fdb"

[toolchain]
llvm_mingw = "20260922"
nsis = "3.13"

[pipeline]
# The XBE certificate's title, which recomp stamps into the banners when
# regen.sh passes no --game-name: gen/ stays byte-identical to regen.sh's.
game_name = "Burnout 3"
gen = "src/game/recomp/gen"
out = "build/xr"
# Never inside the dump: "Burnout 3 Takedown" is the player's own copy, and
# may be a read-only link to it. regen.sh writes the same file.
analysis_json = "build/xr/analysis.json"
seeds = ["config/seed_functions.json"]
# The toolkit's icall_feedback database is BLiNX 2's; regen.sh has none.
icall_seeds = false
# The KickOff spin waits up to a vblank behind the toolkit's flip hold;
# lowered, it yields the guest CPU instead of holding it.
spin_waits = "config/spin_waits.json"
exclude_manual = "src/game/recomp/recomp_manual.c"
split = 1000
names_hooks = []
ghidra = false

[pipeline.disasm]
# Every code section, as regen.sh: without the XDK sections there are no
# function boundaries there.
text_only = false
extra_sections = []

[build]
exe = "burnout3"
# macos: the developer build on a Mac (Metal); there is no macOS bundle.
targets = ["windows", "macos"]
windows_dir = "build-win"
macos_dir = "build"
# Passed on every packaging configure so a cache cannot keep a non-stock
# value: the enhancements layer on, every key stock unless a player's
# config.toml or the environment says otherwise.
# The APU DSP is compiled in and runs by default (RECOMP_APU_DSP=0: the stub).
stock_cmake = ["-DXBOXRECOMP_ENHANCE=ON", "-DXBOXRECOMP_APU_DSP=ON"]
nonstock_vars = []
icon_var = ""

[data]
game_files = "Burnout 3 Takedown"
# dashupdate.xbe is the disc's 58 MB dashboard update; the title never runs it.
# UDATA, TDATA and CACHE are the Xbox user, title and cache folders that runs
# can leave in the dump folder (the bench host's copy has them): one player's
# state, never part of a bundle.
game_files_exclude = ["default_analysis.json", "dashupdate.xbe", "UDATA", "TDATA", "CACHE"]

[input]
script_env = "RECOMP_PAD_SCRIPT"
presets = []

[golden]
json = ""

[package]
# Windows, the SteamOS-like Linux PC (both from the windows build) and the
# Mac. Not "Burnout3": the launcher <app>.exe sits beside burnout3.exe, and
# Windows file names ignore case.
app = "Burnout3Takedown"
product = "burnout3-recomp"
targets = ["windows", "steamos", "macos"]
# macos: Burnout3Takedown.app in a DMG, with the Homebrew dylibs the Mac build
# links (otool -L build/burnout3) bundled; the launcher and Info.plist are
# the game's own, in packaging/macos/.
brew = ["sdl3", "openssl", "libepoxy"]
content = "packaging"
templates = "packaging"
icon = "xbe"

# The owner's whole-game texture pack (burnout3 enhance textures; openspec
# change texture-upscale). The second game after BLiNX 2, with no archive
# reader: the dump alone gives hashes and texels, and every entry stays unnamed.
# The dump this port is made from holds no loose .dds, .xpr or .xbx file; the
# patterns name another release's, should it have any.
[enhance.textures]
sources = ["dump", "loose"]
loose = ["graphics/*", "data/*"]

[bench]
# The host tree is ~/xbox-recomp/<this checkout's name>; settings such as
# BENCH_HOST and BENCH_PREFIX go in scripts/bench.env (see
# scripts/bench.env.example).
remote_name = ""
main_branch = "main"
toolkit_branch = "posix-host/portability"
# The toolkit's Proton tests run before BLiNX 2's goldens; Burnout 3 has none.
toolkit_tests = false
pacing_scenario = ""
# What src/game/main.c's veh_handler prints for a fatal exception.
crash_tag = "[FAULT]"
# Local output of the upstream flow and the A/B probes (rsync does not read
# .gitignore): never sent to the host.
sync_excludes = ["/bin/", "/runs/", "/_local/", "/saves/", "/Play Burnout 3.cmd", "/setup.log", "/TESTING.md"]

[wizard]
repo = "https://github.com/apexJCL/burnout3-recomp.git"
targets = ["windows", "steamos", "macos"]
# No icon: the CLI's generic gamepad glyph. Burnout, EA and Criterion marks
# and game art are not ours to use.
# No [[wizard.fetch]] entries: the clone carries everything else the build
# needs, and the CLI fetches the toolkit, llvm-mingw and NSIS itself by
# the pins in [cli], [toolkit] and its setup-pins.json.

# The wizard's open-source credits (xboxrecomp-cli docs/wizard.md,
# Credits): this fork is ours, listed first, before the CLI's repos.
[[wizard.credit]]
name = "burnout3"
role = "this recompilation of Burnout 3: Takedown for PC and Mac"
license = "MIT"
url = "https://github.com/apexJCL/burnout3-recomp"
own = true

# The project this fork continues. The CLI lists a game's other entries
# after its own group (the CLI, the toolkit fork and upstream's toolkit),
# at the head of the third-party list.
[[wizard.credit]]
name = "burnout3 (upstream)"
role = "the original recompilation of Burnout 3, by sp00nz"
license = "MIT"
url = "https://github.com/sp00nznet/burnout3"

# Only the basic tweaks. The present filter and anisotropic filtering stay
# in config.default.toml, which the Options page points to; pacing is named
# there only in a comment, since its default is per build (main.c).
[[wizard.option]]
key = "scale"
label = "Render scale"
hint = "Draws the game sharper on a big screen; needs a faster graphics card."
kind = "range"
# The toolkit's render.scale stops at 4 (SCALE_MAX in src/enhance/enhance.c).
min = 1
max = 4
default = 1
config = "render.scale"
labels = { "1" = "640×480, as on the Xbox", "2" = "1280×960", "3" = "1920×1440", "4" = "2560×1920, the sharpest" }

[[wizard.option]]
key = "fullscreen"
label = "Start fullscreen"
hint = "Off by default: on the Steam Deck's Desktop Mode, add the game to Steam with the Gamepad template instead."
kind = "bool"
default = false
config = "present.fullscreen"

# Where this repo differs from the standard layout (the CLI's
# docs/layout.md): upstream's files stay where upstream has them, so its
# own build and every upstream diff are unchanged.
[layout]
main = "src/game/main.c"
extra = ["regen.sh", "Setup.cmd", "tools", "CONTRIBUTING.md", "CONTRIBUTORS.md", "ROADMAP.md"]

# The public repo, in export mode: each round is one fresh commit on its
# main (`burnout3 public init` once per clone, then `burnout3 public
# export` and the push it prints). origin is upstream: its commits are
# public already, and the newest one a round contains becomes the round's
# second parent. The private notes, the patterns and the rewrite rules
# stay out of it.
[public]
url = "git@github.com:apexJCL/burnout3-recomp.git"
remote = "public"
mode = "export"
author = "carlos <4037632+apexJCL@users.noreply.github.com>"
exclude = [".claude/**", "CLAUDE.md", "CLAUDE.local.md", ".mcp.json", "REPO_RULES.md", "TESTING.md"]
upstream = "origin/main"
upstream_files = ["docs/screenshots/*"]
