# game.toml: what xboxrecomp-cli needs to know about Burnout 3. The CLI reads
# it on every command (./burnout3 runs the CLI at [cli] commit); see the
# CLI's docs/manifest.md for every key. Upstream's regen.sh, Setup.cmd and
# MSVC build are untouched and still work on their own.
schema = 1

[game]
name = "Burnout 3: Takedown"
slug = "burnout3"
env_header = "src/env/recomp_env_game.h"
env_doc = "docs/running.md"

[xbe]
path = "Burnout 3 Takedown/default.xbe"
title_id = 0x4541005B
# The known dump (the user's, 2026-10-04). Another dump builds, packages and
# plays with a warning.
sha256 = ["9f497acd82adb8edfb72cc31aeeb35010b45d32b13a3f1fc6540717ff24d13f9"]

[cli]
commit = "f476bfa43fdccac0ec24b16f8c3ad1a7df435e2f"
url = "https://github.com/apexJCL/xboxrecomp-cli.git"

[toolkit]
# The same toolkit as BLiNX 2: both games move their pins together.
url = "https://github.com/apexJCL/xboxrecomp.git"
branch = "blinx2/portability"
commit = "6d51fa2d2b9eae4a31b22022925c6e72ad14dd04"

[toolchain]
llvm_mingw = "20260922"
nsis = "3.13"

[pipeline]
# The XBE certificate's title, which recomp stamps into the banners when
# regen.sh passes no --game-name: gen/ stays byte-identical to regen.sh's.
game_name = "Burnout 3"
gen = "src/game/recomp/gen"
out = "build/xr"
# Never inside the dump: "Burnout 3 Takedown" is the player's own copy, and
# may be a read-only link to it. regen.sh writes the same file.
analysis_json = "build/xr/analysis.json"
seeds = ["config/seed_functions.json"]
# The toolkit's icall_feedback database is BLiNX 2's; regen.sh has none.
icall_seeds = false
spin_waits = ""
exclude_manual = "src/game/recomp/recomp_manual.c"
split = 1000
names_hooks = []
ghidra = false

[pipeline.disasm]
# Every code section, as regen.sh: without the XDK sections there are no
# function boundaries there.
text_only = false
extra_sections = []

[build]
exe = "burnout3"
# macos: the developer build on a Mac (Metal); there is no macOS bundle.
targets = ["windows", "macos"]
windows_dir = "build-win"
macos_dir = "build"
# No enhancements layer: the build every Proton run of Burnout 3 used.
stock_cmake = []
nonstock_vars = []
icon_var = ""

[data]
game_files = "Burnout 3 Takedown"
# dashupdate.xbe is the disc's 58 MB dashboard update; the title never runs it.
# UDATA, TDATA and CACHE are the Xbox user, title and cache folders that runs
# can leave in the dump folder (the bench host's copy has them): one player's
# state, never part of a bundle.
game_files_exclude = ["default_analysis.json", "dashupdate.xbe", "UDATA", "TDATA", "CACHE"]

[input]
script_env = "RECOMP_PAD_SCRIPT"
presets = []

[golden]
json = ""

[package]
# Windows, the SteamOS-like Linux PC (both from the windows build) and the
# Mac. Not "Burnout3": the launcher <app>.exe sits beside burnout3.exe, and
# Windows file names ignore case.
app = "Burnout3Takedown"
product = "burnout3-recomp"
targets = ["windows", "steamos", "macos"]
# macos: Burnout3Takedown.app in a DMG, with the Homebrew dylibs the Mac build
# links (otool -L build/burnout3) bundled; the launcher and Info.plist are
# the game's own, in packaging/macos/.
brew = ["sdl2", "openssl", "libepoxy"]
content = "packaging"
templates = "packaging"
icon = "xbe"

[bench]
# The host tree is ~/xbox-recomp/<this checkout's name>; settings such as
# BENCH_HOST and BENCH_PREFIX go in scripts/bench.env (see
# scripts/bench.env.example).
remote_name = ""
main_branch = "main"
toolkit_branch = "posix-host/portability"
# The toolkit's Proton tests run before BLiNX 2's goldens; Burnout 3 has none.
toolkit_tests = false
pacing_scenario = ""
# What src/game/main.c's veh_handler prints for a fatal exception.
crash_tag = "[FAULT]"
# Local output of the upstream flow and the A/B probes (rsync does not read
# .gitignore): never sent to the host.
sync_excludes = ["/bin/", "/runs/", "/_local/", "/saves/", "/Play Burnout 3.cmd", "/setup.log", "/TESTING.md"]
